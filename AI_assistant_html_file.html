<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Therapy for the public. Speak to an AI therapist in real-time.">
    <title>AI Therapist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to Your AI Therapist</h1>
    </header>

    <main>
        <section id="chat-box">
            <div id="conversation"></div>
            <input type="text" id="userInput" placeholder="Ask your therapist..." />
            <button id="sendBtn">Send</button>
        </section>
    </main>

    <footer>
        <p>AI Therapist &copy; 2024</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
